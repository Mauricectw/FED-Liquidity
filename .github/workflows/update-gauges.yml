name: Update market gauges

on:
  schedule:
    # 週一到週五，美股交易時段每小時一次（UTC 13:20–21:20，約台灣 21:20–05:20），
    # 另在收盤後與亞洲早盤各補一次
    - cron: "20 13-21 * * 1-5"
    - cron: "20 23 * * 1-5"
    - cron: "20 0 * * 2-6"
  workflow_dispatch: {}   # 允許在 GitHub 網頁手動點擊「Run workflow」

permissions:
  contents: write

concurrency:
  group: push-to-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest quotes
        run: python gauges/fetch_gauges.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gauges/data.json
          git diff --staged --quiet && exit 0
          git commit -m "auto: update market gauges $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
