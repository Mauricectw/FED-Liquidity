<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>總經傳導筆記｜市場五儀表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#EDF0F1; --panel:#FFFFFF; --ink:#16222A; --muted:#5B6B74; --line:#D5DDE1;
  --accent:#2F5D7C; --inset:#F5F7F8;
  --g:#23875A; --y:#C98C0E; --r:#C23B2B; --off:#CBD3D8;
  --g-bg:#E3F3EA; --y-bg:#FBF1DA; --r-bg:#F8E3E0; --spark-fill:rgba(47,93,124,.12);
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F161B; --panel:#172129; --ink:#E4EBEF; --muted:#93A4AE; --line:#2A3740;
    --accent:#7FB0D2; --inset:#121B21;
    --g:#3FBF83; --y:#E8B03A; --r:#EF6A57; --off:#33424C;
    --g-bg:#16322A; --y-bg:#352B14; --r-bg:#3A1F1C; --spark-fill:rgba(127,176,210,.14);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F161B; --panel:#172129; --ink:#E4EBEF; --muted:#93A4AE; --line:#2A3740;
  --accent:#7FB0D2; --inset:#121B21;
  --g:#3FBF83; --y:#E8B03A; --r:#EF6A57; --off:#33424C;
  --g-bg:#16322A; --y-bg:#352B14; --r-bg:#3A1F1C; --spark-fill:rgba(127,176,210,.14);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.8;margin:0;padding:28px 16px 64px}
.layout{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}.toc{position:static!important;max-height:none!important}}
.toc{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;font-size:13.5px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.toc a{color:var(--muted);text-decoration:none;display:block;padding:2px 0;line-height:1.5}
.toc a:hover{color:var(--accent)}
.toc .l2{font-weight:700;color:var(--ink);margin-top:8px}
.toc .l3{padding-left:10px}
.back{display:inline-block;margin-bottom:10px;color:var(--accent);font-weight:500;text-decoration:none}
article{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px clamp(16px,4vw,40px);max-width:76ch}
article h1{font-size:30px;font-weight:900;margin:0 0 8px}
article h2{font-size:23px;font-weight:900;margin:44px 0 8px;padding-top:14px;border-top:2px solid var(--line)}
article h3{font-size:19px;margin:32px 0 6px;color:var(--accent)}
article h4{font-size:16.5px;margin:24px 0 4px}
article h1,article h2,article h3,article h4{text-wrap:balance;line-height:1.4;scroll-margin-top:16px}
article p,article li{margin:8px 0}
article ul,article ol{padding-left:1.4em}
article blockquote{margin:14px 0;padding:10px 14px;border-left:4px solid var(--y);background:var(--y-bg);border-radius:0 8px 8px 0;font-size:14.5px}
article blockquote p{margin:0}
article code{font-family:var(--mono);font-size:.9em;background:var(--inset);padding:1px 5px;border-radius:4px}
a[id]{scroll-margin-top:16px}
:target + h1,:target + h2,:target + h3,:target + h4{background:var(--y-bg);border-radius:6px}
.err{color:var(--r)}
.fig{margin:18px 0;background:var(--inset);border:1px solid var(--line);border-radius:12px;padding:14px 14px 10px;position:relative}
.fig .ft{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;font-size:14px;font-weight:700;margin-bottom:4px}
.fig .ft span{font-weight:400;color:var(--muted);font-size:12.5px}
.fig .last{font-family:var(--mono);font-size:13px;color:var(--ink)}
.fig svg{display:block;width:100%;height:auto;overflow:visible}
.fig .ax{font-size:11px;fill:var(--muted);font-family:var(--mono)}
.fig .rl{font-size:11px;fill:var(--muted);font-family:var(--sans);paint-order:stroke;stroke:var(--inset);stroke-width:3px;stroke-linejoin:round}
.fig .cap{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.fig .tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;font-family:var(--mono);white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.fig .lg{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px}
.fig .lg i{display:inline-block;width:18px;border-top:2px solid var(--accent);vertical-align:middle;margin-right:5px}
.fig .lg i.b{border-top:2px dashed var(--muted)}
.multi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.multi figure{margin:0;text-align:center;font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="layout">
  <nav class="toc" id="toc" aria-label="目錄"><a class="back" href="./">← 回到市場五儀表</a></nav>
  <article id="doc"><p>載入筆記中…</p></article>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(async()=>{
  const doc=document.getElementById("doc"), toc=document.getElementById("toc");
  try{
    const r=await fetch("notes.md?ts="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    doc.innerHTML = marked.parse(await r.text());
  }catch(e){ doc.innerHTML='<p class="err">讀取 notes.md 失敗。</p>'; return; }
  // 目錄：用緊鄰標題前的 <a id> 當錨點，沒有的就自動編號
  let n=0;
  doc.querySelectorAll("h2,h3").forEach(h=>{
    let prev=h.previousElementSibling, a=prev&&prev.querySelector?prev.querySelector("a[id]"):null;
    if(prev&&prev.tagName==="A"&&prev.id) a=prev;
    let id=a?a.id:(h.id||("s"+(++n)));
    if(!a&&!h.id) h.id=id;
    const l=document.createElement("a"); l.href="#"+id; l.textContent=h.textContent; l.className=h.tagName==="H2"?"l2":"l3";
    toc.appendChild(l);
  });
  if(location.hash){ const t=document.getElementById(decodeURIComponent(location.hash.slice(1))); if(t) t.scrollIntoView(); }
  drawFigures();
})();

const NS="http://www.w3.org/2000/svg";
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function niceTicks(lo,hi,n=4){
  const span=hi-lo||1, step0=span/n, mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=step0);
  const out=[]; for(let v=Math.ceil(lo/step)*step; v<=hi+1e-9; v+=step) out.push(+v.toFixed(6)); return out;
}
async function drawFigures(){
  const figs=[...document.querySelectorAll(".fig")];
  if(!figs.length) return;
  let M=null;
  try{ const r=await fetch("macro.json?ts="+Date.now(),{cache:"no-store"}); if(r.ok) M=(await r.json()).series; }catch(e){}
  figs.forEach(el=>{
    if(el.dataset.diagram) return diagram(el, el.dataset.diagram);
    const s=M&&M[el.dataset.chart];
    if(!s){ el.innerHTML=`<p class="cap">這張圖的數據還沒抓到，下次自動更新後就會出現（FRED ${esc(el.dataset.chart)}）。</p>`; return; }
    lineChart(el,s);
  });
}
function lineChart(el,s){
  const from=el.dataset.from||"2015-01";
  let d=[],v=[]; s.d.forEach((x,i)=>{ if(x>=from){ d.push(x); v.push(s.v[i]); } });
  const refs=(el.dataset.refs||"").split("|").filter(Boolean).map(t=>{const i=t.indexOf(":");return {y:+t.slice(0,i),l:t.slice(i+1)};});
  const band=el.dataset.band? el.dataset.band.split(","):null;
  const bar=el.dataset.type==="bar";
  const W=680,H=240,L=44,R=12,T=10,B=26;
  let lo=Math.min(...v, ...refs.map(r=>r.y)), hi=Math.max(...v, ...refs.map(r=>r.y));
  if(band){ lo=Math.min(lo,+band[0]); hi=Math.max(hi,+band[1]); }
  if(bar) lo=Math.min(lo,0);
  const pad=(hi-lo)*0.08||1; lo-=pad; hi+=pad;
  const X=i=>L+(W-L-R)*(d.length<2?0.5:i/(d.length-1)), Y=y=>T+(H-T-B)*(1-(y-lo)/(hi-lo));
  let g="";
  niceTicks(lo,hi).forEach(t=>{ g+=`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text class="ax" x="${L-6}" y="${Y(t)+4}" text-anchor="end">${t}</text>`; });
  const years=[...new Set(d.map(x=>x.slice(0,4)))], every=Math.ceil(years.length/7);
  years.forEach((yr,k)=>{ if(k%every) return; const i=d.indexOf(yr+"-01"); if(i<0) return; g+=`<text class="ax" x="${X(i)}" y="${H-6}" text-anchor="middle">${yr}</text>`; });
  let lab="";
  if(band){ g+=`<rect x="${L}" width="${W-L-R}" y="${Y(+band[1])}" height="${Y(+band[0])-Y(+band[1])}" fill="var(--g)" opacity=".14"/>`; lab+=`<text class="rl" x="${L+6}" y="${Y(+band[1])-4}">${esc(band[2]||"")}</text>`; }
  refs.forEach(r=>{ lab+=`<line x1="${L}" x2="${W-R}" y1="${Y(r.y)}" y2="${Y(r.y)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1"/><text class="rl" x="${W-R}" y="${Y(r.y)-4}" text-anchor="end">${esc(r.l)}</text>`; });
  if(bar){
    const bw=Math.max(1.5,(W-L-R)/d.length-1.5);
    v.forEach((y,i)=>{ const y0=Y(0), y1=Y(y); g+=`<rect x="${X(i)-bw/2}" width="${bw}" y="${Math.min(y0,y1)}" height="${Math.max(1,Math.abs(y1-y0))}" rx="1" fill="${y<0?"var(--r)":"var(--accent)"}"/>`; });
  }else{
    g+=`<path d="${v.map((y,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(y).toFixed(1)).join("")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
    g+=`<circle cx="${X(v.length-1)}" cy="${Y(v[v.length-1])}" r="4" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"/>`;
  }
  g+=lab;
  g+=`<line class="xh" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>`;
  const lastV=v[v.length-1];
  el.innerHTML=`<div class="ft">${esc(s.name)}<span>FRED，月資料，最新 <b class="last">${d[d.length-1]}：${lastV}${esc(s.unit==="千人"?" 千人":s.unit)}</b></span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(s.name)}走勢圖">${g}</svg><div class="tip" hidden></div>`;
  const svg=el.querySelector("svg"), tip=el.querySelector(".tip"), xh=svg.querySelector(".xh");
  svg.addEventListener("pointermove",e=>{
    const r=svg.getBoundingClientRect(), x=(e.clientX-r.left)/r.width*W;
    const i=Math.max(0,Math.min(d.length-1,Math.round((x-L)/(W-L-R)*(d.length-1))));
    xh.setAttribute("x1",X(i)); xh.setAttribute("x2",X(i)); xh.setAttribute("visibility","visible");
    tip.hidden=false; tip.textContent=`${d[i]}　${v[i]}${s.unit==="千人"?" 千人":s.unit}`;
    const px=X(i)/W*r.width, fr=el.getBoundingClientRect();
    tip.style.left=Math.min(r.left-fr.left+px+10, fr.width-tip.offsetWidth-8)+"px"; tip.style.top=(r.top-fr.top+8)+"px";
  });
  svg.addEventListener("pointerleave",()=>{ tip.hidden=true; xh.setAttribute("visibility","hidden"); });
}
const TEN=["3M","2Y","5Y","10Y","30Y"];
function curveSvg(before,after,W,H,labels,rng){
  const L=34,R=labels?52:10,T=12,B=22, all=[...before||[],...after], lo=rng?rng[0]:Math.min(...all)-0.2, hi=rng?rng[1]:Math.max(...all)+0.2;
  const X=i=>L+(W-L-R)*i/(TEN.length-1), Y=y=>T+(H-T-B)*(1-(y-lo)/(hi-lo));
  const path=a=>a.map((y,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(y).toFixed(1)).join("");
  let g="";
  TEN.forEach((t,i)=>{ g+=`<text class="ax" x="${X(i)}" y="${H-5}" text-anchor="middle">${t}</text>`; });
  if(labels) niceTicks(lo,hi,3).forEach(t=>{ g+=`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text class="ax" x="${L-5}" y="${Y(t)+4}" text-anchor="end">${t}%</text>`; });
  if(before) g+=`<path d="${path(before)}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/>`;
  g+=`<path d="${path(after)}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
  after.forEach((y,i)=>{ g+=`<circle cx="${X(i)}" cy="${Y(y)}" r="3.5" fill="var(--accent)" stroke="var(--inset)" stroke-width="2"/>`; });
  if(labels){
    if(before) g+=`<text class="rl" x="${X(4)+8}" y="${Y(before[4])+4}">之前</text>`;
    g+=`<text class="rl" x="${X(4)+8}" y="${Y(after[4])+4}" style="fill:var(--accent);font-weight:700">之後</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
const DIAG={
  "bear-flat":{t:"示意圖：熊市平坦化",b:[4.0,4.1,4.2,4.4,4.6],a:[4.9,4.9,4.75,4.65,4.75],c:"短端大漲、長端小漲，利差收窄。市場認為升息合理，經濟撐得住。"},
  "bull-flat":{t:"示意圖：短端漲、長端跌（筆記所說的牛市平坦化）",b:[4.0,4.1,4.2,4.4,4.6],a:[4.5,4.45,4.2,4.05,4.15],c:"短端還在漲，長端預期未來會被迫降息而下跌，利差急速收斂甚至倒掛。"},
  "bear-steep":{t:"示意圖：2023 年 8～10 月的熊市陡峭化",b:[5.45,5.0,4.3,4.0,4.1],a:[5.5,5.05,4.75,4.9,5.05],c:"Fed 已停止升息，2Y 幾乎不動；長債發行量大增加上信評調降，期限溢酬把 10Y、30Y 推高。數值為示意，不是實際收盤價。"},
};
function diagram(el,k){
  if(k==="shapes"){
    const S=[["正常（左低右高）",[3.0,3.4,3.7,4.0,4.3]],["陡峭",[1.0,1.8,2.8,3.8,4.6]],["平坦",[4.0,4.05,4.0,4.05,4.1]],["倒掛（左高右低）",[5.4,5.0,4.5,4.2,4.3]]];
    el.innerHTML=`<div class="ft">示意圖：殖利率曲線的四種形狀</div><div class="multi">${S.map(([n,a])=>`<figure>${curveSvg(null,a,200,120,false,[0.6,5.8])}<figcaption>${n}</figcaption></figure>`).join("")}</div>
      <p class="cap">橫軸是天期（3 個月到 30 年），縱軸是殖利率。10Y−2Y 為負就是倒掛。</p>`;
    return;
  }
  const D=DIAG[k]; if(!D) return;
  el.innerHTML=`<div class="ft">${D.t}</div>${curveSvg(D.b,D.a,560,220,true)}
    <div class="lg"><span><i class="b"></i>之前</span><span><i></i>之後</span></div><p class="cap">${D.c}</p>`;
}

</script>
</body>
</html>
