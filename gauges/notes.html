<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>總經傳導筆記｜市場五儀表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#EDF0F1; --panel:#FFFFFF; --ink:#16222A; --muted:#5B6B74; --line:#D5DDE1;
  --accent:#2F5D7C; --inset:#F5F7F8;
  --g:#23875A; --y:#C98C0E; --r:#C23B2B; --off:#CBD3D8;
  --g-bg:#E3F3EA; --y-bg:#FBF1DA; --r-bg:#F8E3E0; --spark-fill:rgba(47,93,124,.12);
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F161B; --panel:#172129; --ink:#E4EBEF; --muted:#93A4AE; --line:#2A3740;
    --accent:#7FB0D2; --inset:#121B21;
    --g:#3FBF83; --y:#E8B03A; --r:#EF6A57; --off:#33424C;
    --g-bg:#16322A; --y-bg:#352B14; --r-bg:#3A1F1C; --spark-fill:rgba(127,176,210,.14);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F161B; --panel:#172129; --ink:#E4EBEF; --muted:#93A4AE; --line:#2A3740;
  --accent:#7FB0D2; --inset:#121B21;
  --g:#3FBF83; --y:#E8B03A; --r:#EF6A57; --off:#33424C;
  --g-bg:#16322A; --y-bg:#352B14; --r-bg:#3A1F1C; --spark-fill:rgba(127,176,210,.14);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.8;margin:0;padding:28px 16px 64px}
.layout{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}.toc{position:static!important;max-height:none!important}}
.toc{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;font-size:13.5px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.toc a{color:var(--muted);text-decoration:none;display:block;padding:2px 0;line-height:1.5}
.toc a:hover{color:var(--accent)}
.toc .l2{font-weight:700;color:var(--ink);margin-top:8px}
.toc .l3{padding-left:10px}
.back{display:inline-block;margin-bottom:10px;color:var(--accent);font-weight:500;text-decoration:none}
article{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px clamp(16px,4vw,40px);max-width:76ch}
article h1{font-size:30px;font-weight:900;margin:0 0 8px}
article h2{font-size:23px;font-weight:900;margin:44px 0 8px;padding-top:14px;border-top:2px solid var(--line)}
article h3{font-size:19px;margin:32px 0 6px;color:var(--accent)}
article h4{font-size:16.5px;margin:24px 0 4px}
article h1,article h2,article h3,article h4{text-wrap:balance;line-height:1.4;scroll-margin-top:16px}
article p,article li{margin:8px 0}
article ul,article ol{padding-left:1.4em}
article blockquote{margin:14px 0;padding:10px 14px;border-left:4px solid var(--y);background:var(--y-bg);border-radius:0 8px 8px 0;font-size:14.5px}
article blockquote p{margin:0}
article code{font-family:var(--mono);font-size:.9em;background:var(--inset);padding:1px 5px;border-radius:4px}
a[id]{scroll-margin-top:16px}
:target + h1,:target + h2,:target + h3,:target + h4{background:var(--y-bg);border-radius:6px}
.err{color:var(--r)}
</style>
</head>
<body>
<div class="layout">
  <nav class="toc" id="toc" aria-label="目錄"><a class="back" href="./">← 回到市場五儀表</a></nav>
  <article id="doc"><p>載入筆記中…</p></article>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(async()=>{
  const doc=document.getElementById("doc"), toc=document.getElementById("toc");
  try{
    const r=await fetch("notes.md?ts="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    doc.innerHTML = marked.parse(await r.text());
  }catch(e){ doc.innerHTML='<p class="err">讀取 notes.md 失敗。</p>'; return; }
  // 目錄：用緊鄰標題前的 <a id> 當錨點，沒有的就自動編號
  let n=0;
  doc.querySelectorAll("h2,h3").forEach(h=>{
    let prev=h.previousElementSibling, a=prev&&prev.querySelector?prev.querySelector("a[id]"):null;
    if(prev&&prev.tagName==="A"&&prev.id) a=prev;
    let id=a?a.id:(h.id||("s"+(++n)));
    if(!a&&!h.id) h.id=id;
    const l=document.createElement("a"); l.href="#"+id; l.textContent=h.textContent; l.className=h.tagName==="H2"?"l2":"l3";
    toc.appendChild(l);
  });
  if(location.hash){ const t=document.getElementById(decodeURIComponent(location.hash.slice(1))); if(t) t.scrollIntoView(); }
})();
</script>
</body>
</html>
